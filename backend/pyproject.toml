[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fidx-ghost"
version = "0.1.0"
description = "Fidx-Ghost — local-first cyber intelligence workstation (backend + ghost CLI)"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "httpx>=0.27",
  "cryptography>=42",
  "click>=8.1",
]

[project.scripts]
ghost = "ghost.cli:app"

[tool.setuptools.packages.find]
include = ["ghost*"]
